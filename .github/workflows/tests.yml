name: Native checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source
        run: ./scripts/prepare-source.sh
      - name: Build CPU packer
        run: make CUDA=OFF JOBS=2
      - name: Native regression tests
        run: make test JOBS=2
